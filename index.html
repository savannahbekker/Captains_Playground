const D4=[[0,1],[1,0],[0,-1],[-1,0]];
function connected(reg,n,g){let cells=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(reg[r][c]==g)cells.push([r,c]);if(!cells.length)return false;
const seen=new Set([cells[0]+'']),st=[cells[0]];while(st.length){const[r,c]=st.pop();for(const[d,e]of D4){const a=r+d,b=c+e;if(a>=0&&b>=0&&a<n&&b<n&&reg[a][b]==g&&!seen.has(a+','+b)){seen.add(a+','+b);st.push([a,b])}}}return seen.size==cells.length}
function gen(n,seed){const R=rng(seed);for(let t=0;t<5000;t++){const pos=randSol(n,R),reg=[...Array(n)].map(()=>Array(n).fill(-1));pos.forEach((c,r)=>reg[r][c]=r);let left=n*n-n;
while(left){const o=[];for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(reg[r][c]<0)for(const[d,e]of D4){const v=(reg[r+d]||[])[c+e];if(v>=0)o.push([r,c,v])}
const[r,c,v]=o[R()*o.length|0];reg[r][c]=v;left--}

const alt=s.find(x=>x.some((c,i)=>c!=pos[i]));if(!alt)break;const rows=shuf(alt.map((c,i)=>i).filter(i=>alt[i]!=pos[i]),R);let moved=false;

else if(S=='set'){const t=(k,l)=>`<div class=set>${l}<button class="${P.set[k]?'':'g'}" data-a=tog data-v=${k}>${P.set[k]?'On':'Off'}</button></div>`;
h=`<button class=g data-a=home>‹ Back</button><h2>Settings</h2><div class=card>${t('cb','Colour-blind symbols')}${t('dark','Dark mode')}${t('snd','Sound')}${t('hap','Vibration')}</div><button class=g data-a=wipe>Erase all progress</button><p style="font-size:12px">Everything is stored on this device only.</p>`}
else if(S=='play'&&G){h=`<div class=row style="justify-content:space-between;align-items:center"><button class=g data-a=home>‹ Menu</button><b>${G.title}</b><span style="width:70px;color:#e5484d;font-size:18px">${'♥'.repeat(Math.max(0,G.lives))}${'♡'.repeat(3-Math.max(0,G.lives))}</span></div>${sceneWrap(board())}<div class=msg>${msg||'Tap once for ✕. Double-tap quickly for a dog. Tap an ✕ later to clear it. Drag to mark many ✕. A wrong dog costs a heart.'}</div><div class=row><button data-a=hint>Hint</button><button class=g data-a=reset>Reset</button></div>`}
if(wn)h+=`<div class=ov><div class=card><h2>Puzzle solved! 🎉</h2><p>${wn.q}</p><div class=big>${dogSvg(DOGS[P.fav])}</div>${wn.nu?`<p><b>New dog unlocked: ${wn.nu[0]}!</b></p><div style="width:90px;margin:auto">${dogSvg(wn.nu)}</div>`:''}${G.lvl&&G.lvl<LV?'<button data-a=next>Next level</button>':''}<button class=g data-a=home>Menu</button></div></div>`+[...Array(14)].map((_,i)=>`<span class=cf style="left:${i*7}%;animation-delay:${i*.1}s">🐾</span>`).join('');
if(rc&&G)h+=`<div class=ov><div class=card><h2>Are you sure?</h2><p>The level will restart from scratch: empty board, no red marks, 3 hearts.</p><button data-a=yes>Yes</button><button class=g data-a=no>No</button></div></div>`;
if(ls)h+=`<div class=ov><div class=card><div class=big>${sadSvg(DOGS[P.fav])}</div><h2>Out of lives</h2><p>${lsm||pick(OL)}</p><p style="font-size:13px;opacity:.7">Same puzzle, fresh start, no waiting.</p><button data-a=retry>Reset</button><button class=g data-a=home>Menu</button></div></div>`;$.innerHTML=h;if(S=='play'&&G){if(SC.id!==G.id)sceneLoop()}else if(SC.id){SC.t.forEach(clearTimeout);SC.t=[];SC.id=null;SC.st=''}if(S=='levels'){const c=document.getElementById('cur');if(c)c.scrollIntoView({block:'center'})}}
const A={home(){S='home';G=null;wn=null;ls=0;rc=0;msg='';draw()},levels(){S='levels';draw()},coll(){S='coll';draw()},set(){S='set';draw()},
lvl(v){v=+v;start({mode:'L',n:lvN(v),seed:v*7919+lvN(v),id:'L'+v,title:'Level '+v,lvl:v})},
next(){wn=null;A.lvl(G.lvl+1)},
end(v){const n=SZ[v];start({mode:'E',n,seed:Date.now()&0xffffff,id:'E'+Date.now(),title:sz[v]+' puzzle'})},
daily(){const d=new Date(),k=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;let s=0;for(const c of k)s=s*31+c.charCodeAt(0)|0;start({mode:'D',n:7,seed:s,id:'D'+k,title:'Daily '+k})},
cont(){G=P.game;G.lives=G.lives??3;G.wr=G.wr||[];ls=G.lives<=0?1:0;S='play';draw()},
undo(){if(!G.hist.length)return;G.fut.push(JSON.stringify(G.cells));G.cells=JSON.parse(G.hist.pop());hl=null;msg='';save();draw()},
redo(){if(!G.fut.length)return;G.hist.push(JSON.stringify(G.cells));G.cells=JSON.parse(G.fut.pop());save();draw()},
hint(){const h=hint();if(h){hl=h.c;msg=h.t}draw()},
reset(){rc=1;draw()},
yes(){rc=0;A.retry()},
no(){rc=0;draw()},
retry(){G.cells=G.cells.map(r=>r.map(()=>0));G.wr=[];G.lives=3;G.hist=[];G.fut=[];ls=0;msg='';hl=null;save();draw()},
fav(v){P.fav=+v;save();draw()},tog(k){P.set[k]=P.set[k]?0:1;if(k=='dark')ap();save();draw()},
wipe(){if(confirm('Erase all progress and dogs?')){P={done:{},solved:{},fav:0,set:P.set,game:null};save();draw()}}};
$.onclick=e=>{const b=e.target.closest('[data-a]');if(b)A[b.dataset.a](b.dataset.v)};
let dr=null;
const mark=(r,c)=>{if(G.cells[r][c]!=0||isW(r,c)||ls)return;G.cells[r][c]=1;const el=$.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(el)el.innerHTML+='<b class=x>✕</b>';hap()};
$.addEventListener('pointerdown',e=>{const c=e.target.closest('.cl');if(!c||S!='play'||!G||wn||ls)return;dr={r:+c.dataset.r,c:+c.dataset.c,drag:false,old:JSON.stringify(G.cells)}});
document.addEventListener('pointermove',e=>{if(!dr)return;const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest&&el.closest('.cl');if(!c)return;const r=+c.dataset.r,k=+c.dataset.c;if(!dr.drag){if(r==dr.r&&k==dr.c)return;dr.drag=true;hl=null;mark(dr.r,dr.c)}mark(r,k)});
const up=()=>{if(!dr)return;const d=dr;dr=null;if(d.drag){lt=null;if(JSON.stringify(G.cells)!=d.old){G.hist.push(d.old);if(G.hist.length>80)G.hist.shift();G.fut=[];msg='';beep(440)}save();draw()}else tap(d.r,d.c)};
document.addEventListener('pointerup',up);document.addEventListener('pointercancel',()=>{if(dr&&dr.drag)up();else dr=null});
document.addEventListener('visibilitychange',()=>{if(G&&P.game)save()});
if(P.game&&P.game.n&&P.game.cells){G=null}else P.game=null;
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
